name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  static:
    name: fmt · validate · lint · scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Format check
        run: terraform fmt -check -recursive .

      # No backend and no credentials: this catches type errors, bad references
      # and unknown provider arguments on every PR, for free.
      - name: Validate every client stack
        run: |
          for d in $(find clients -mindepth 2 -maxdepth 2 -type d); do
            echo "::group::$d"
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        run: |
          tflint --init --config="$PWD/.tflint.hcl"
          tflint --recursive --config="$PWD/.tflint.hcl"

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  plan:
    name: plan (${{ matrix.client }}/${{ matrix.env }})
    runs-on: ubuntu-latest
    needs: static
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { client: acme, env: staging }
          - { client: acme, env: prod }
          - { client: training, env: staging }
    # Each client-environment gets its own GitHub environment, so its state
    # credentials are scoped to that one COS bucket.
    environment: ${{ matrix.client }}-${{ matrix.env }}-plan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Plan
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          d=clients/${{ matrix.client }}/${{ matrix.env }}
          terraform -chdir=$d init -backend-config=backend.hcl -input=false
          terraform -chdir=$d plan -input=false -lock-timeout=5m
